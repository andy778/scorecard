id: packageKeepsProvenance
lifecycle: experimental
short: Checks that the latest version of the project's registry packages doesn't drop provenance that other versions have.
motivation: >
  When a project that publishes with provenance releases a version without it, the version was most likely published outside the usual CI workflow,
  for example by hand with a token. That is also what a release by an attacker with a stolen token looks like, so it deserves a closer look.
implementation: >
  The probe looks for packages the repository publishes to npm (see packagePublishedWithTrustedPublishing). If the version tagged latest has no
  provenance, it lists all versions of the package and looks for any version that has provenance.
outcome:
  - For each package, the outcome is OutcomeFalse if the latest version has no provenance but another version does.
  - Otherwise the outcome is OutcomeTrue. A package that never had provenance is not penalized by this probe; see packageHasProvenanceFromRepo.
  - If the project doesn't publish packages to a supported registry, the outcome is OutcomeNotApplicable.
remediation:
  onOutcome: False
  effort: Low
  text:
    - Publish every release, including releases from maintenance branches, through the CI workflow that adds provenance.
    - Check that the version without provenance was published by a maintainer.
ecosystem:
  languages:
    - javascript
  clients:
    - github
    - gitlab
