id: packagePublishedWithTrustedPublishing
lifecycle: experimental
short: Checks whether the latest version of the project's registry packages was published with trusted publishing.
motivation: >
  Publishing with a long-lived registry token means anyone who obtains the token, from a maintainer's machine or a CI secret, can publish a malicious version.
  Trusted publishing replaces the token with short-lived OIDC credentials that the registry only accepts from a CI workflow the maintainers configured.
implementation: >
  The probe looks for packages the repository publishes to npm: the root package.json and its workspaces, skipping private packages and packages whose
  repository field doesn't point back to the repository. For the version tagged latest, it checks whether the registry recorded a trusted publisher
  (the trustedPublisher field of _npmUser).
outcome:
  - For each package, the outcome is OutcomeTrue if the latest version was published with trusted publishing, and OutcomeFalse otherwise.
  - If the project doesn't publish packages to a supported registry, the outcome is OutcomeNotApplicable.
remediation:
  onOutcome: False
  effort: Low
  text:
    - Configure [npm trusted publishing](https://docs.npmjs.com/trusted-publishers) for your package, publish from CI, and then revoke the package's publish tokens.
ecosystem:
  languages:
    - javascript
  clients:
    - github
    - gitlab
